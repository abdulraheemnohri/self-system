version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: self_system_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - self_system_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: self_system_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - self_system_network

  app:
    build: .
    container_name: self_system_app
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./plugins:/app/plugins
      - ./tests:/app/tests
      - ./generated_skills:/app/generated_skills
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped
    networks:
      - self_system_network

volumes:
  ollama_data:
  qdrant_data:

networks:
  self_system_network:
    driver: bridge