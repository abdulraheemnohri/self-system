# Complete Allostatic Self System Configuration

system:
  name: "Complete Allostatic Self System"
  version: "1.0.0"
  mode: "development"
  log_level: "INFO"
  storage_path: "storage"
  db_path: "storage/allostatic_self.db"
  audit_log_path: "storage/audit.log"
  require_human_approval_for_dangerous_actions: true
  claim_consciousness: false

llm:
  provider: "openai-compatible"
  base_url: "http://localhost:11434/v1"
  api_key: "${LLM_API_KEY}"
  model: "llama3.1"
  embedding_model: "nomic-embed-text"
  temperature: 0.5
  max_tokens: 1200
  timeout: 90
  retry_attempts: 2
  fallback_mode: "knowledge_only"
